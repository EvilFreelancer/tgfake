<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tgfake</title>
<style>
  :root { color-scheme: light dark; font: 14px/1.4 system-ui, sans-serif; }
  body { margin: 0; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 0; height: 100vh; }
  @media (max-width: 800px) { body { grid-template-columns: 1fr; height: auto; } }
  section { display: flex; flex-direction: column; min-height: 0; border-right: 1px solid #8884; padding: 12px 16px; box-sizing: border-box; }
  h1 { font-size: 15px; margin: 0 0 8px; }
  form.who { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
  form.who label { display: flex; flex-direction: column; font-size: 11px; opacity: .8; }
  form.who input, form.who select { font: inherit; width: 9em; }
  #log, #outbox { flex: 1; overflow: auto; border: 1px solid #8884; border-radius: 6px; padding: 8px; min-height: 12em; }
  .msg { margin: 6px 0; padding: 6px 10px; border-radius: 10px; max-width: 85%; white-space: pre-wrap; word-break: break-word; }
  .user { background: #4a90e233; margin-left: auto; }
  .bot { background: #8883; }
  .meta { font-size: 11px; opacity: .6; }
  .kb { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
  .kb button { font: inherit; }
  .draft { border: 1px dashed #888; border-radius: 10px; padding: 6px 10px; margin: 6px 0; opacity: .8; white-space: pre-wrap; }
  .typing { font-style: italic; opacity: .6; }
  form.send { display: flex; gap: 6px; margin-top: 8px; }
  form.send input { flex: 1; font: inherit; }
  .call { font-family: ui-monospace, monospace; font-size: 12px; border-bottom: 1px solid #8882; padding: 3px 0; white-space: pre-wrap; word-break: break-all; }
  .call .m { font-weight: bold; }
  .call.err .m { color: #d33; }
  .tools { display: flex; gap: 6px; margin-bottom: 8px; align-items: center; font-size: 12px; }
  .kb button.webapp::after { content: " \2197"; opacity: .7; }
  body.mini-open { grid-template-columns: minmax(0, 1fr) 480px minmax(0, 1fr); }
  @media (max-width: 1100px) { body.mini-open { grid-template-columns: 1fr; height: auto; } }
  #miniapp[hidden] { display: none; }
  #miniapp { align-items: flex-start; gap: 8px; min-width: 0; overflow: auto; }
  .mini-tools { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; font-size: 12px; max-width: 460px; }
  /* The phone: the Mini App slides up from the bottom of the screen, and half
     open it shows its top part there, the chat still in sight above it. */
  .phone { position: relative; flex: none; border: 10px solid #111; border-radius: 28px; overflow: hidden; box-sizing: content-box;
    display: flex; flex-direction: column; justify-content: flex-end;
    background: repeating-linear-gradient(0deg, #17212b 0 46px, #1d2a36 46px 48px); }
  .phone-head { flex: none; display: flex; align-items: center; gap: 8px; height: 48px; padding: 0 10px; box-sizing: border-box; background: #212121; color: #fff; font-size: 14px; border-radius: 12px 12px 0 0; }
  .phone-head button { font: inherit; background: none; border: 0; color: inherit; cursor: pointer; padding: 4px 6px; }
  .phone-head .title { flex: 1; text-align: center; font-weight: 600; }
  .phone-view { flex: none; position: relative; overflow: hidden; background: #000; }
  .phone-view iframe { display: block; border: 0; width: 100%; background: transparent; }
  .phone-loading { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #aaa; background: #212121; font-size: 13px; }
  .phone-loading[hidden] { display: none; }
  .phone-keyboard { flex: none; height: 0; overflow: hidden; background: repeating-linear-gradient(90deg, #3a3a3c 0 34px, #2c2c2e 34px 38px); color: #aaa; font-size: 12px; display: flex; align-items: center; justify-content: center; }
  #miniappLog { font-family: ui-monospace, monospace; font-size: 11px; max-height: 14em; overflow: auto; border: 1px solid #8884; border-radius: 6px; padding: 6px; width: 100%; box-sizing: border-box; white-space: pre-wrap; word-break: break-all; }
  #miniappLog .in { color: #2e7d32; }
  #miniappLog .out { color: #1565c0; }
  #miniappStatus { font-size: 11px; opacity: .75; }
  .kb button.url::after { content: " \2197"; opacity: .7; }
  #linkNotice { font-size: 12px; color: #d33; margin-top: 4px; }
  #linkNotice:empty { display: none; }
  body.browser-open { grid-template-columns: minmax(0, 1fr) 500px minmax(0, 1fr); }
  body.mini-open.browser-open { grid-template-columns: minmax(0, 1fr) 480px 500px minmax(0, 1fr); }
  @media (max-width: 1100px) { body.browser-open, body.mini-open.browser-open { grid-template-columns: 1fr; height: auto; } }
  #browser[hidden] { display: none; }
  #browser { align-items: flex-start; gap: 8px; min-width: 0; overflow: auto; }
  /* Telegram's in-app browser on iOS: the address bar under the status bar,
     the site below it down to the bottom of the screen, and the toolbar
     floating over the bottom of the site. */
  .tgb { --tgb-bg: #000; --tgb-fg: #fff; --tgb-button: #1c1c1e; --tgb-bar: rgba(44, 44, 46, .86);
    position: relative; flex: none; border: 10px solid #111; border-radius: 28px; overflow: hidden; box-sizing: content-box;
    display: flex; flex-direction: column; background: var(--tgb-bg); color: var(--tgb-fg); }
  .tgb.light { --tgb-bg: #fff; --tgb-fg: #000; --tgb-button: #f2f2f7; --tgb-bar: rgba(242, 242, 247, .9); }
  .tgb-status { flex: none; }
  .tgb-head { flex: none; position: relative; display: flex; align-items: flex-start; gap: 13px; height: 69px; padding: 18px 16px 0; box-sizing: border-box; }
  .tgb button { font: inherit; color: inherit; border: 0; cursor: pointer; padding: 0; display: flex; align-items: center; justify-content: center; }
  .tgb-round { flex: none; width: 44px; height: 44px; border-radius: 22px; background: var(--tgb-button); }
  .tgb-address { flex: 1; min-width: 0; height: 44px; border-radius: 22px; background: var(--tgb-button); display: flex; align-items: center; justify-content: center; padding: 0 14px; font-size: 16px; }
  .tgb-address span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tgb-menu { position: absolute; top: 66px; right: 16px; z-index: 2; display: flex; flex-direction: column; min-width: 180px; border-radius: 12px; overflow: hidden; background: var(--tgb-button); box-shadow: 0 6px 24px #0008; }
  .tgb-menu[hidden] { display: none; }
  .tgb .tgb-menu button { justify-content: flex-start; padding: 10px 14px; background: none; font-size: 14px; }
  .tgb-view { flex: none; position: relative; overflow: hidden; background: #fff; }
  .tgb-view iframe { display: block; border: 0; width: 100%; height: 100%; }
  .tgb-toolbar { position: absolute; left: 50%; bottom: 26px; transform: translateX(-50%); width: min(330px, calc(100% - 32px)); height: 48px; border-radius: 24px;
    display: flex; justify-content: space-around; align-items: center; background: var(--tgb-bar); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); box-shadow: 0 2px 12px #0005; }
  .tgb-toolbar button { width: 50px; height: 48px; background: none; }
  .tgb-toolbar button:disabled { opacity: .35; cursor: default; }
  #browserLog { font-family: ui-monospace, monospace; font-size: 11px; max-height: 14em; overflow: auto; border: 1px solid #8884; border-radius: 6px; padding: 6px; width: 100%; box-sizing: border-box; white-space: pre-wrap; word-break: break-all; }
  #browserStatus { font-size: 11px; opacity: .75; }
</style>
</head>
<body>
<section>
  <h1>tgfake - the person's side of the chat</h1>
  <form class="who" onsubmit="return false">
    <label>chat id <input id="chat" value="4242"></label>
    <label>user id <input id="user" value="4242"></label>
    <label>username <input id="username" value="alice"></label>
    <label>chat type <select id="ctype"><option>private</option><option>group</option><option>supergroup</option></select></label>
    <label>mention bot <input id="mention" type="checkbox" style="width:auto"></label>
    <label>open links in <select id="linksIn"><option value="browser">in-app browser</option><option value="tab">new tab</option></select></label>
  </form>
  <div id="log"></div>
  <div id="linkNotice" role="status"></div>
<div id="inlinePanel" hidden>
  <form class="send" id="inlineForm"><input id="inlineText" placeholder="inline query"><button>Search</button><button type="button" id="inlineClose">Close</button></form>
  <div id="inlineResults"></div>
</div>
  <div id="replyPrompt" role="status"></div>
  <button type="button" id="keyboardToggle" hidden>Reply keyboard</button>
  <div id="replyKeyboard" hidden></div>
  <form class="send" id="sendForm">
  <button type="button" id="inlineButton" hidden>Inline</button>
    <button type="button" id="menuButton" hidden title="The bot's menu button opens its Mini App"></button>
    <input id="text" placeholder="message or /command" autocomplete="off" autofocus>
    <button>Send</button>
  </form>
</section>
<section id="miniapp" hidden>
  <div class="mini-tools">
    <strong>Mini App</strong>
    <label>size <select id="miniappSize"><option value="390x844">390&times;844</option><option value="360x640">360&times;640</option><option value="430x932">430&times;932</option></select></label>
    <label>window <select id="miniappState"><option value="expanded">expanded</option><option value="half">half open</option></select></label>
    <label>theme <select id="miniappTheme"><option value="dark">dark</option><option value="light">light</option></select></label>
    <label><input type="checkbox" id="miniappFullscreen"> fullscreen insets</label>
    <label><input type="checkbox" id="miniappKeyboard"> keyboard</label>
    <label>Bot API <input id="miniappVersion" value="10.1" size="4"></label>
    <button type="button" id="miniappReload">Reload</button>
  </div>
  <div class="phone" id="miniappPhone">
    <div class="phone-head" id="miniappHead">
      <button type="button" id="miniappBack" hidden>&lsaquo; Back</button>
      <button type="button" id="miniappClose">Close</button>
      <span class="title" id="miniappTitle"></span>
      <span style="width:3em"></span>
    </div>
    <div class="phone-view" id="miniappView">
      <iframe id="miniappFrame" title="Mini App" allow="clipboard-read; clipboard-write"></iframe>
      <div class="phone-loading" id="miniappLoading">loading&hellip;</div>
    </div>
    <div class="phone-keyboard" id="miniappKbd">keyboard</div>
  </div>
  <div id="miniappStatus"></div>
  <div id="miniappLog"></div>
</section>
<section id="browser" hidden>
  <div class="mini-tools">
    <strong>Browser</strong>
    <label>size <select id="browserSize"><option value="390x844">390&times;844</option><option value="360x640">360&times;640</option><option value="430x932">430&times;932</option><option value="440x956">440&times;956</option></select></label>
    <label>theme <select id="browserTheme"><option value="dark">dark</option><option value="light">light</option></select></label>
    <button type="button" id="browserReload">Reload</button>
  </div>
  <div class="tgb" id="browserPhone">
    <div class="tgb-status" id="browserStatusBar"></div>
    <div class="tgb-head">
      <button type="button" class="tgb-round" id="browserClose" aria-label="Close" title="Close"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      <div class="tgb-address" id="browserAddress"><span id="browserHost"></span></div>
      <button type="button" class="tgb-round" id="browserMenu" aria-label="Menu" title="Menu" aria-expanded="false"><svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg></button>
      <div class="tgb-menu" id="browserMenuList" hidden>
        <button type="button" data-action="reload">Reload</button>
        <button type="button" data-action="copy">Copy link</button>
        <button type="button" data-action="external">Open in a new tab</button>
      </div>
    </div>
    <div class="tgb-view" id="browserView">
      <iframe id="browserFrame" title="In-app browser" allow="clipboard-write; fullscreen"></iframe>
    </div>
    <div class="tgb-toolbar">
      <button type="button" id="browserBack" aria-label="Back" title="Back"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
      <button type="button" id="browserForward" aria-label="Forward" title="Forward"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button>
      <button type="button" id="browserShare" aria-label="Share" title="Share: copies the link"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 8l5-5 5 5M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/></svg></button>
      <button type="button" id="browserBookmark" aria-label="Bookmark" title="Add to bookmarks"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M6 3h12v18l-6-5-6 5z"/></svg></button>
      <button type="button" id="browserExternal" aria-label="Open in a new tab" title="Open in a new tab"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/></svg></button>
    </div>
  </div>
  <div id="browserStatus"></div>
  <div id="browserLog"></div>
</section>
<section>
  <div class="tools">
    <strong>Bot API calls</strong>
    <label><input id="showPolls" type="checkbox"> show getUpdates</label>
    <button id="reset" type="button">Reset</button>
    <span id="state"></span>
  </div>
  <div id="outbox"></div>
</section>
<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const num = (id) => Number($(id).value) || 0;
  let lastSeq = 0;
  let inlineID = '';
 let replyTo = 0, keyboardKey = '', keyboardOpen = true;
 $('keyboardToggle').addEventListener('click', () => { keyboardOpen = !keyboardOpen; $('replyKeyboard').hidden = !keyboardOpen; });

  async function post(path, body) {
    const r = await fetch(path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    if (!r.ok) { const e = await r.json().catch(() => ({})); alert(e.error || r.statusText); }
    return r;
  }

  $('sendForm').addEventListener('submit', async (ev) => {
    ev.preventDefault();
    const text = $('text').value.trim();
    if (!text) return;
    await post('/sim/message', { chat_id: num('chat'), user_id: num('user'), username: $('username').value,
      chat_type: $('ctype').value, text, reply_to_message_id: replyTo, mention: $('mention').checked });
    $('text').value = '';
    refreshChat();
  });
  $('reset').addEventListener('click', async () => { await post('/sim/reset', {}); lastSeq = 0; $('outbox').textContent = ''; refreshChat(); });
  $('showPolls').addEventListener('change', () => { lastSeq = 0; $('outbox').textContent = ''; refreshOutbox(); });
  $('inlineButton').addEventListener('click', () => { $('inlinePanel').hidden = false; $('inlineText').focus(); });
  $('inlineClose').addEventListener('click', () => { $('inlinePanel').hidden = true; inlineID = ''; });
  $('inlineForm').addEventListener('submit', async (ev) => { ev.preventDefault(); await startInline($('inlineText').value); });

  async function startInline(query) {
    const r = await post('/sim/inline', { user_id: num('user'), username: $('username').value, query, chat_type: $('ctype').value });
    if (!r.ok) return;
    inlineID = (await r.json()).inline_query_id;
    $('inlineText').value = query;
    $('inlinePanel').hidden = false;
    $('inlineResults').textContent = 'Waiting for the bot...';
  }

  async function refreshInline() {
    if (!inlineID) return;
    const data = await (await fetch('/sim/inline')).json();
    const query = data.queries.find((q) => q.query.id === inlineID);
    if (!query || !query.answered) return;
    const results = $('inlineResults');
    results.textContent = query.results.length ? '' : 'No results';
    for (const result of query.results) {
      const btn = el('button', '', result.title || result.caption || result.id);
      btn.type = 'button';
      btn.addEventListener('click', async () => {
        const r = await post('/sim/inline/choose', { inline_query_id: inlineID, result_id: result.id, chat_id: num('chat'), chat_type: $('ctype').value });
        if (r.ok) { inlineID = ''; $('inlinePanel').hidden = true; refreshChat(); }
      });
      results.appendChild(btn);
    }
  }

  function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; }

  // ---- Links: Telegram turns the web addresses in a message into links and
  // opens them, and url buttons, in its in-app browser, unless the person has
  // chosen to open links in a browser app (here: a new tab).
  const WEB_ADDRESS = /https?:\/\/[^\s<>"']+/gi;
  function isWebAddress(address) {
    try { const p = new URL(address).protocol; return p === 'http:' || p === 'https:'; } catch (e) { return false; }
  }
  function inAppBrowser() { return $('linksIn').value === 'browser'; }
  function linkTitle(address) {
    return 'Opens ' + address + (inAppBrowser() && isWebAddress(address) ? ' in the in-app browser' : ' in a new tab');
  }
  function openLink(address) {
    if (inAppBrowser() && isWebAddress(address)) browser.open(address);
    else window.open(address, '_blank', 'noopener');
  }
  function notice(text) { $('linkNotice').textContent = text; }
  // trimAddress drops what follows an address in a sentence: punctuation that
  // ends the sentence, and a closing bracket the address did not open, so
  // (https://en.wikipedia.org/wiki/Foo_(bar)) keeps the bracket of Foo_(bar).
  function trimAddress(address) {
    const count = (s, c) => s.split(c).length - 1;
    for (;;) {
      const before = address;
      address = address.replace(/[.,;:!?]+$/, '');
      for (const [open, close] of [['(', ')'], ['[', ']']]) {
        if (address.endsWith(close) && count(address, close) > count(address, open)) address = address.slice(0, -1);
      }
      if (address === before) return address;
    }
  }
  // withLinks is the text of a message with its web addresses as links.
  function withLinks(text) {
    const box = el('div');
    text = text === undefined || text === null ? '' : String(text);
    let last = 0;
    for (const match of text.matchAll(WEB_ADDRESS)) {
      const address = trimAddress(match[0]);
      if (match.index > last) box.appendChild(document.createTextNode(text.slice(last, match.index)));
      const a = el('a', 'link', address);
      a.setAttribute('href', address);
      a.target = '_blank';
      a.rel = 'noopener';
      a.title = linkTitle(address);
      a.addEventListener('click', (ev) => { if (inAppBrowser()) { ev.preventDefault(); browser.open(address); } });
      box.appendChild(a);
      last = match.index + address.length;
    }
    if (last < text.length) box.appendChild(document.createTextNode(text.slice(last)));
    return box;
  }

  async function refreshChat() {
    const chatID = num('chat');
    const v = await (await fetch('/sim/chat/' + chatID)).json();
    replyTo = v.force_reply ? v.force_reply.message_id : 0;
    $('replyPrompt').textContent = replyTo ? 'Reply to #' + replyTo : '';
    $('text').placeholder = (v.force_reply && v.force_reply.input_field_placeholder) || (v.reply_keyboard && v.reply_keyboard.input_field_placeholder) || 'message or /command';
    const keyboard = $('replyKeyboard');
    keyboard.textContent = '';
    $('keyboardToggle').hidden = !v.reply_keyboard;
    const nextKey = JSON.stringify([chatID, num('user'), v.reply_keyboard, !!v.keyboard_hidden]);
    if (nextKey !== keyboardKey) { keyboardOpen = !v.keyboard_hidden; keyboardKey = nextKey; }
    keyboard.hidden = !v.reply_keyboard || !keyboardOpen;
    if (v.reply_keyboard) v.reply_keyboard.keyboard.forEach((row, ri) => {
      const line = el('div', 'keyboard-row');
      row.forEach((button, ci) => {
        const b = el('button', '', button.text); b.type = 'button';
        b.addEventListener('click', async () => {
          const response = await post('/sim/keyboard/press', {chat_id: chatID, user_id: num('user'), username: $('username').value, row: ri, column: ci});
          if (response.ok && v.reply_keyboard.one_time_keyboard) { keyboardOpen = false; keyboard.hidden = true; }
          refreshChat();
        });
        line.appendChild(b);
      });
      keyboard.appendChild(line);
    });
    const log = $('log');
    const stick = log.scrollTop + log.clientHeight >= log.scrollHeight - 8;
    log.textContent = '';
    for (const m of v.messages) {
      if (m.deleted) continue;
      const box = el('div', 'msg ' + (m.from === 'bot' ? 'bot' : 'user'));
      const meta = [ '#' + m.message_id, m.from === 'bot' ? 'bot' : (m.username || 'user') ];
      if (m.parse_mode) meta.push(m.parse_mode);
      if (m.rich) meta.push('rich');
      if (m.edited) meta.push('edited');
      if (m.reply_to_message_id) meta.push('reply to #' + m.reply_to_message_id);
      box.appendChild(el('div', 'meta', meta.join(' · ')));
      if (m.photo) {
        const img = el('img');
        img.src = '/sim/file/' + encodeURIComponent(m.photo.file_id);
        img.alt = m.photo.name;
        img.style.cssText = 'max-width:240px;display:block;border-radius:8px;margin:4px 0';
        box.appendChild(img);
      }
      if (m.document) {
        box.appendChild(el('div', '', '[document ' + m.document.name + ']'));
      }
      for (const kind of ['video', 'animation', 'audio', 'voice', 'video_note']) {
        if (!m[kind]) continue;
        const media = el(kind === 'audio' || kind === 'voice' ? 'audio' : 'video');
        media.controls = true;
        media.src = '/sim/file/' + encodeURIComponent(m[kind].file_id);
        media.style.cssText = 'max-width:240px;display:block;margin:4px 0';
        box.appendChild(el('div', '', '[' + kind + ' ' + m[kind].name + ']'));
        box.appendChild(media);
      }
      if (m.venue) box.appendChild(el('div', '', '[venue ' + m.venue.title + '] ' + m.venue.address));
      else if (m.location) box.appendChild(el('div', '', '[location ' + m.location.latitude + ', ' + m.location.longitude + ']'));
      if (m.contact) box.appendChild(el('div', '', '[contact ' + m.contact.first_name + '] ' + m.contact.phone_number));
      if (m.web_app_data) box.appendChild(el('div', '', '[web_app_data ' + m.web_app_data.button_text + '] ' + m.web_app_data.data));
      if (m.invoice) box.appendChild(el('div', '', '[invoice ' + m.invoice.title + ' ' + m.invoice.total_amount + ' ' + m.invoice.currency + '] ' + m.invoice.description));
      if (m.successful_payment) box.appendChild(el('div', '', '[payment ' + m.successful_payment.total_amount + ' ' + m.successful_payment.currency + '] ' + m.successful_payment.invoice_payload));
      if (m.refunded_payment) box.appendChild(el('div', '', '[refund ' + m.refunded_payment.total_amount + ' ' + m.refunded_payment.currency + '] ' + m.refunded_payment.invoice_payload));
      // The person's tap on Pay: the stand queues the pre-checkout query.
      const pay = async () => {
        await post('/sim/invoice/pay', { chat_id: chatID, user_id: num('user'), username: $('username').value, message_id: m.message_id });
        refreshChat();
      };
      if (m.caption) {
        box.appendChild(withLinks(m.caption));
      }
      if (!m.photo && !m.document) {
        box.appendChild(withLinks(m.text));
      }
      if (m.keyboard) {
        for (const row of m.keyboard) {
          const kb = el('div', 'kb');
          for (const b of row) {
            const btn = el('button', b.web_app ? 'webapp' : (b.url ? 'url' : ''), b.text);
            btn.type = 'button';
            if (b.web_app) btn.title = 'Opens ' + b.web_app.url + ' as a Mini App';
            else if (b.url) btn.title = linkTitle(b.url);
            btn.addEventListener('click', async () => {
              if (b.web_app) { miniApp.open(b.web_app.url); return; }
              if (b.pay) { await pay(); return; }
              if (b.url) { openLink(b.url); return; }
              if (b.copy_text) { await navigator.clipboard.writeText(b.copy_text.text); return; }
              const inlineQuery = b.switch_inline_query ?? b.switch_inline_query_current_chat;
              if (inlineQuery !== undefined) { await startInline(inlineQuery); return; }
              await post('/sim/callback', { chat_id: chatID, user_id: num('user'), username: $('username').value, message_id: m.message_id, data: b.callback_data });
              refreshChat();
            });
            kb.appendChild(btn);
          }
          box.appendChild(kb);
        }
      } else if (m.invoice) {
        // An invoice without a keyboard shows Telegram's own Pay button.
        const kb = el('div', 'kb');
        const btn = el('button', '', 'Pay');
        btn.type = 'button';
        btn.addEventListener('click', pay);
        kb.appendChild(btn);
        box.appendChild(kb);
      }
      log.appendChild(box);
    }
    for (const d of v.drafts) {
      const box = el('div', 'draft');
      box.appendChild(el('div', 'meta', 'draft ' + d.draft_id + ' · revision ' + d.revisions));
      box.appendChild(el('div', '', d.markdown));
      if (d.can_stop) {
        const stop = el('button', '', 'Stop');
        stop.type = 'button';
        stop.addEventListener('click', async () => {
          await post('/sim/draft/stop', { chat_id: chatID, draft_id: d.draft_id });
          refreshChat();
        });
        box.appendChild(stop);
      }
      log.appendChild(box);
    }
    if (v.typing) log.appendChild(el('div', 'typing', 'typing…'));
    if (stick) log.scrollTop = log.scrollHeight;
    const menu = v.menu_button;
    const mb = $('menuButton');
    if (menu && menu.type === 'web_app' && menu.web_app) {
      mb.hidden = false;
      mb.textContent = '\u2630 ' + menu.text;
      mb.dataset.url = menu.web_app.url;
    } else {
      mb.hidden = true;
    }
    await refreshInline();
  }

  async function refreshOutbox() {
    const r = await (await fetch('/sim/outbox?since=' + lastSeq)).json();
    const out = $('outbox');
    for (const c of r.calls) {
      lastSeq = c.seq;
      if (!$('showPolls').checked && c.method.toLowerCase() === 'getupdates') continue;
      const line = el('div', 'call' + (c.status >= 400 ? ' err' : ''));
      line.appendChild(el('span', 'm', c.seq + ' ' + c.method + ' ' + c.status + ' '));
      const parts = [];
      for (const k of Object.keys(c.params).sort()) {
        let v = c.params[k];
        if (v.length > 120) v = v.slice(0, 120) + '…';
        parts.push(k + '=' + v.replace(/\n/g, '\\n'));
      }
      line.appendChild(el('span', '', parts.join(' ')));
      out.appendChild(line);
      out.scrollTop = out.scrollHeight;
    }
    const st = await (await fetch('/sim/state')).json();
    botName = st.bot.username;
    $('inlineButton').hidden = !st.bot.supports_inline_queries;
    $('state').textContent = '@' + st.bot.username + ' · pending ' + st.pending_updates + ' · faults ' + st.faults.length;
  }

  // ---- Mini App: this page is the Telegram client of the app in the frame,
  // the way web.telegram.org is. The app posts {eventType, eventData} to its
  // parent, and the page answers with messages of the same shape. Everything
  // either side sends is logged here and kept in window.__tgfakeMiniApp.
  const HEAD = 48, KEYBOARD = 260, HALF = 0.55;
  const miniApp = window.__tgfakeMiniApp = {
    events: [], url: '', origin: '*', ready: false, expanded: true,
    backVisible: false, swipes: true, closingConfirmation: false,
    headerColor: '', backgroundColor: '', bottomBarColor: '',
    size() { const [w, h] = $('miniappSize').value.split('x').map(Number); return { w, h }; },
    fullscreen() { return $('miniappFullscreen').checked; },
    keyboard() { return $('miniappKeyboard').checked; },
    // webViewHeight is the height of the WebView itself; visibleHeight the
    // part of it the person sees. Half open, the WebView keeps its height and
    // the frame clips it, as on a phone; an Android keyboard shrinks it.
    webViewHeight() { const h = this.size().h - (this.fullscreen() ? 0 : HEAD); return this.keyboard() ? h - KEYBOARD : h; },
    visibleHeight() { const h = this.webViewHeight(); return this.expanded ? h : Math.round(h * HALF); },
    log(dir, type, data) {
      const entry = { dir, type, data: data === undefined ? null : data, at: Date.now() };
      this.events.push(entry);
      const line = el('div', dir, (dir === 'in' ? '\u2190 app  ' : '\u2192 app  ') + type + (data === undefined || data === '' ? '' : ' ' + JSON.stringify(data)));
      const box = $('miniappLog'); box.appendChild(line); box.scrollTop = box.scrollHeight;
    },
    post(type, data) {
      const frame = $('miniappFrame');
      if (!frame.contentWindow) return;
      this.log('out', type, data);
      frame.contentWindow.postMessage(JSON.stringify({ eventType: type, eventData: data }), this.origin);
    },
    sendViewport(stable) {
      this.post('viewport_changed', { height: this.visibleHeight(), is_expanded: this.expanded, is_state_stable: stable !== false });
    },
    safeArea() { return this.fullscreen() ? { top: 47, bottom: 34, left: 0, right: 0 } : { top: 0, bottom: 0, left: 0, right: 0 }; },
    contentSafeArea() { return this.fullscreen() ? { top: 46, bottom: 0, left: 0, right: 0 } : { top: 0, bottom: 0, left: 0, right: 0 }; },
    async sendTheme() {
      const params = await (await fetch('/sim/webapp/theme/' + $('miniappTheme').value)).json();
      this.post('theme_changed', { theme_params: params });
    },
    layout() {
      const { w, h } = this.size();
      const phone = $('miniappPhone'), view = $('miniappView'), frame = $('miniappFrame');
      phone.style.width = w + 'px';
      phone.style.height = h + 'px';
      $('miniappHead').style.display = this.fullscreen() ? 'none' : '';
      view.style.height = this.visibleHeight() + 'px';
      frame.style.height = this.webViewHeight() + 'px';
      $('miniappKbd').style.height = this.keyboard() ? KEYBOARD + 'px' : '0';
      $('miniappBack').hidden = !this.backVisible;
      $('miniappStatus').textContent = [
        'WebView ' + w + '\u00d7' + this.webViewHeight(), 'visible ' + this.visibleHeight(),
        this.expanded ? 'expanded' : 'half open', 'swipes ' + (this.swipes ? 'on' : 'off'),
        this.closingConfirmation ? 'confirms closing' : '', this.ready ? 'ready' : 'not ready',
      ].filter(Boolean).join(' \u00b7 ');
    },
    async open(url) {
      const body = { chat_id: num('chat'), user_id: num('user'), username: $('username').value,
        color_scheme: $('miniappTheme').value, version: $('miniappVersion').value };
      if (url) body.url = url;
      const r = await post('/sim/webapp/launch', body);
      if (!r.ok) return;
      const launched = await r.json();
      this.url = launched.url;
      try { this.origin = new URL(launched.url).origin; } catch (e) { this.origin = '*'; }
      this.ready = false; this.expanded = $('miniappState').value === 'expanded'; this.backVisible = false;
      this.swipes = true; this.closingConfirmation = false;
      $('miniappTitle').textContent = '@' + (botName || 'bot');
      $('miniappLoading').hidden = false;
      $('miniapp').hidden = false;
      document.body.classList.add('mini-open');
      this.layout();
      this.log('out', 'open', { url: launched.url });
      $('miniappFrame').src = launched.url;
    },
    close() {
      if (this.closingConfirmation && !confirm('Close the Mini App? Changes you made may not be saved.')) return;
      $('miniappFrame').src = 'about:blank';
      $('miniapp').hidden = true;
      document.body.classList.remove('mini-open');
      this.log('out', 'closed');
    },
    receive(type, data) {
      this.log('in', type, data);
      switch (type) {
        case 'web_app_ready': this.ready = true; $('miniappLoading').hidden = true; break;
        case 'web_app_expand': if (!this.expanded) { this.expanded = true; $('miniappState').value = 'expanded'; this.layout(); this.sendViewport(); } break;
        case 'web_app_request_viewport': this.sendViewport(); break;
        case 'web_app_request_theme': this.sendTheme(); break;
        case 'web_app_request_safe_area': this.post('safe_area_changed', this.safeArea()); break;
        case 'web_app_request_content_safe_area': this.post('content_safe_area_changed', this.contentSafeArea()); break;
        case 'web_app_setup_back_button': this.backVisible = !!(data && data.is_visible); break;
        case 'web_app_setup_swipe_behavior': this.swipes = !(data && data.allow_vertical_swipe === false); break;
        case 'web_app_setup_closing_behavior': this.closingConfirmation = !!(data && data.need_confirmation); break;
        case 'web_app_set_header_color':
          this.headerColor = (data && (data.color || data.color_key)) || '';
          if (data && data.color) {
            const head = $('miniappHead');
            head.style.background = data.color;
            // Telegram picks the text colour that reads on the header.
            head.style.color = isDark(data.color) ? '#ffffff' : '#000000';
          }
          break;
        case 'web_app_set_background_color': this.backgroundColor = (data && data.color) || ''; if (data && data.color) $('miniappView').style.background = data.color; break;
        case 'web_app_set_bottom_bar_color': this.bottomBarColor = (data && data.color) || ''; break;
        case 'web_app_open_link': if (data && data.url) window.open(data.url, '_blank', 'noopener'); break;
        case 'web_app_close': this.closingConfirmation = false; this.close(); return;
      }
      this.layout();
    },
    setState(next) {
      if (next.size) $('miniappSize').value = next.size;
      if (next.window) { $('miniappState').value = next.window; this.expanded = next.window === 'expanded'; }
      if (next.theme) $('miniappTheme').value = next.theme;
      if (next.fullscreen !== undefined) $('miniappFullscreen').checked = !!next.fullscreen;
      if (next.keyboard !== undefined) $('miniappKeyboard').checked = !!next.keyboard;
      this.layout();
      this.sendViewport();
      this.post('safe_area_changed', this.safeArea());
      this.post('content_safe_area_changed', this.contentSafeArea());
      if (next.theme) this.sendTheme();
    },
    back() { this.post('back_button_pressed'); },
  };
  let botName = '';
  // isDark is the SDK's brightness rule for a #rrggbb colour.
  function isDark(hex) {
    const m = /^#?([0-9a-f]{6})$/i.exec(String(hex).trim());
    if (!m) return true;
    const v = parseInt(m[1], 16), r = (v >> 16) & 255, g = (v >> 8) & 255, b = v & 255;
    return Math.sqrt(0.299 * r * r + 0.587 * g * g + 0.114 * b * b) < 120;
  }
  window.addEventListener('message', (ev) => {
    const frame = $('miniappFrame');
    if (!frame.contentWindow || ev.source !== frame.contentWindow) return;
    let msg;
    try { msg = typeof ev.data === 'string' ? JSON.parse(ev.data) : ev.data; } catch (e) { return; }
    if (!msg || !msg.eventType) return;
    miniApp.receive(msg.eventType, msg.eventData);
  });
  $('miniappBack').addEventListener('click', () => miniApp.back());
  $('miniappClose').addEventListener('click', () => miniApp.close());
  $('miniappReload').addEventListener('click', () => { if (miniApp.url) { miniApp.ready = false; $('miniappLoading').hidden = false; miniApp.layout(); $('miniappFrame').src = miniApp.url; } });
  $('miniappState').addEventListener('change', () => miniApp.setState({ window: $('miniappState').value }));
  $('miniappSize').addEventListener('change', () => miniApp.setState({}));
  $('miniappFullscreen').addEventListener('change', () => miniApp.setState({}));
  $('miniappKeyboard').addEventListener('change', () => miniApp.setState({}));
  $('miniappTheme').addEventListener('change', () => miniApp.setState({ theme: $('miniappTheme').value }));
  $('menuButton').addEventListener('click', () => miniApp.open(''));

  // ---- In-app browser: the site loads in a frame as wide as the phone's
  // screen, so it is laid out at the width a Telegram user sees. The geometry
  // is Telegram for iOS on an iPhone: the status bar of each screen size, the
  // address bar 69 px under it, and the toolbar 48 px high floating 26 px
  // above the bottom of the screen, over the site. The frame cannot read where
  // a site of another origin has navigated to, so Back and Forward step
  // through the addresses the browser was asked to open.
  const STATUS_BAR = { '390x844': 47, '360x640': 20, '430x932': 59, '440x956': 62 };
  const ADDRESS_BAR = 69;
  let scrollbarPx;
  // scrollbarWidth is what a scrollbar of the browser showing this page takes
  // from the content: 0 where scrollbars overlay it, as on a phone.
  function scrollbarWidth() {
    if (scrollbarPx === undefined) {
      const probe = el('div');
      probe.style.cssText = 'position:absolute;top:-1000px;width:100px;height:100px;overflow:scroll';
      document.body.appendChild(probe);
      scrollbarPx = probe.offsetWidth - probe.clientWidth;
      probe.remove();
    }
    return scrollbarPx;
  }
  const browser = window.__tgfakeBrowser = {
    url: '', history: [], index: -1, events: [], bookmarks: [], page: null,
    size() { const [w, h] = $('browserSize').value.split('x').map(Number); return { w, h }; },
    statusBar() { return STATUS_BAR[$('browserSize').value]; },
    viewport() { const { w, h } = this.size(); return { width: w, height: h - this.statusBar() - ADDRESS_BAR }; },
    log(type, data) {
      this.events.push({ type, data: data === undefined ? null : data, at: Date.now() });
      const box = $('browserLog');
      box.appendChild(el('div', '', type + (data === undefined ? '' : ' ' + JSON.stringify(data))));
      box.scrollTop = box.scrollHeight;
    },
    layout() {
      const { w, h } = this.size(), vp = this.viewport();
      const phone = $('browserPhone');
      phone.style.width = w + 'px';
      phone.style.height = h + 'px';
      phone.classList.toggle('light', $('browserTheme').value === 'light');
      $('browserStatusBar').style.height = this.statusBar() + 'px';
      $('browserView').style.height = vp.height + 'px';
      $('browserBack').disabled = this.index <= 0;
      $('browserForward').disabled = this.index >= this.history.length - 1;
      const scrollbar = scrollbarWidth();
      $('browserStatus').textContent = [
        'WebView ' + vp.width + '×' + vp.height,
        this.page ? 'page ' + this.page.width + '×' + this.page.height : '',
        'status bar ' + this.statusBar() + ' px', 'address bar ' + ADDRESS_BAR + ' px',
        // A phone draws its scrollbar over the page; a desktop browser may
        // take its width from a page that scrolls.
        scrollbar ? "this browser's scrollbar takes " + scrollbar + ' px of a page that scrolls, which a phone does not' : '',
      ].filter(Boolean).join(' · ');
    },
    load(address) {
      this.url = address;
      this.page = null;
      let host = address;
      try { host = new URL(address).host; } catch (e) { /* shown as given */ }
      $('browserHost').textContent = host;
      $('browserAddress').title = address;
      $('browserMenuList').hidden = true;
      $('browserFrame').src = address;
      this.layout();
    },
    open(address) {
      address = String(address === undefined || address === null ? '' : address).trim();
      if (!isWebAddress(address)) {
        notice('Not opened: ' + address + ' is not an http or https address, and the in-app browser opens only those.');
        this.log('refused', { url: address });
        return false;
      }
      notice('');
      this.history = this.history.slice(0, this.index + 1);
      this.history.push(address);
      this.index = this.history.length - 1;
      $('browser').hidden = false;
      document.body.classList.add('browser-open');
      this.log('open', { url: address });
      this.load(address);
      return true;
    },
    close() {
      $('browserFrame').src = 'about:blank';
      $('browser').hidden = true;
      document.body.classList.remove('browser-open');
      this.url = ''; this.history = []; this.index = -1; this.page = null;
      this.log('closed');
    },
    reload() { if (this.url) { this.log('reload', { url: this.url }); this.load(this.url); } },
    back() { if (this.index > 0) { this.index--; this.log('back', { url: this.history[this.index] }); this.load(this.history[this.index]); } },
    forward() { if (this.index < this.history.length - 1) { this.index++; this.log('forward', { url: this.history[this.index] }); this.load(this.history[this.index]); } },
    // share stands for Telegram's share sheet and copy for Copy Link of its
    // menu: both leave the address on the clipboard here.
    share() { this.copy('share'); },
    copy(type) {
      if (!this.url) return;
      this.log(type || 'copy', { url: this.url });
      if (navigator.clipboard) navigator.clipboard.writeText(this.url).catch(() => {});
    },
    bookmark() { if (this.url) { this.bookmarks.push(this.url); this.log('bookmark', { url: this.url }); } },
    openExternally() { if (this.url) { this.log('open_external', { url: this.url }); window.open(this.url, '_blank', 'noopener'); } },
    setState(next) {
      if (next.size && Object.prototype.hasOwnProperty.call(STATUS_BAR, next.size)) $('browserSize').value = next.size;
      if (next.theme === 'dark' || next.theme === 'light') $('browserTheme').value = next.theme;
      this.page = null;
      this.layout();
      this.measure();
    },
    // measure reads the size a site of this page's origin is laid out at;
    // a site of another origin keeps it to itself.
    measure() {
      try {
        const win = $('browserFrame').contentWindow;
        if (!win || win.location.href === 'about:blank') return;
        const root = win.document.documentElement;
        this.page = { width: root.clientWidth, height: root.clientHeight };
        if (win.location.href !== this.url) $('browserHost').textContent = win.location.host;
      } catch (e) { this.page = null; }
      this.layout();
    },
  };
  $('browserFrame').addEventListener('load', () => {
    if (!browser.url) return;
    browser.measure();
    browser.log('load', browser.page ? { url: browser.url, page: browser.page } : { url: browser.url });
  });
  $('browserClose').addEventListener('click', () => browser.close());
  $('browserReload').addEventListener('click', () => browser.reload());
  $('browserBack').addEventListener('click', () => browser.back());
  $('browserForward').addEventListener('click', () => browser.forward());
  $('browserShare').addEventListener('click', () => browser.share());
  $('browserBookmark').addEventListener('click', () => browser.bookmark());
  $('browserExternal').addEventListener('click', () => browser.openExternally());
  $('browserMenu').addEventListener('click', () => {
    const list = $('browserMenuList');
    list.hidden = !list.hidden;
    $('browserMenu').setAttribute('aria-expanded', String(!list.hidden));
  });
  $('browserMenuList').addEventListener('click', (ev) => {
    const action = ev.target.closest('button') && ev.target.closest('button').dataset.action;
    $('browserMenuList').hidden = true;
    $('browserMenu').setAttribute('aria-expanded', 'false');
    if (action === 'reload') browser.reload();
    else if (action === 'copy') browser.copy();
    else if (action === 'external') browser.openExternally();
  });
  $('browserSize').addEventListener('change', () => browser.setState({}));
  $('browserTheme').addEventListener('change', () => browser.setState({}));
  // The page's own address can open the browser: /?browser=<url>&size=440x956&theme=light.
  const launchParams = new URLSearchParams(location.search);
  if (launchParams.has('browser')) {
    browser.setState({ size: launchParams.get('size'), theme: launchParams.get('theme') });
    browser.open(launchParams.get('browser'));
  }

  $('chat').addEventListener('change', refreshChat);
  setInterval(refreshChat, 1000);
  setInterval(refreshOutbox, 1000);
  refreshChat();
  refreshOutbox();
})();
</script>
</body>
</html>
