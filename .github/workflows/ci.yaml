# Tests, lint and the release path on every push to main and every pull
# request. A handful of jobs run side by side and the last one, CI, is the gate
# a branch protection rule points at: it passes only when all of them did.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  test:
    name: Test (${{ matrix.os }}, Go ${{ matrix.go }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: [stable]
        include:
          # The oldest toolchain go.mod admits, so a bot pinned to it can
          # import the package.
          - os: ubuntu-latest
            go: "1.22"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Test
        if: runner.os != 'Linux'
        run: go test -count=1 ./...

      - name: Test under the race detector
        if: runner.os == 'Linux'
        run: go test -race -count=1 ./...

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # golangci-lint v2.12.2 is built with Go 1.26 and panics on a newer
      # standard library, so the two move together.
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.2
          args: ./...

      - name: go mod tidy leaves nothing to change
        run: go mod tidy -diff

  # The release as it would be published, without publishing it: every
  # archive is built once here, and the install job below installs it on each
  # runner system the way a bot's own workflow would, before any tag exists.
  snapshot:
    name: Release snapshot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true

      - name: Build every release archive
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --snapshot --clean

      - uses: actions/upload-artifact@v4
        with:
          name: snapshot
          path: |
            dist/tgfake_*.tar.gz
            dist/tgfake_*.zip
            dist/checksums.txt
            dist/metadata.json
          retention-days: 3

  # scripts/install.sh installs the host's archive from a local mirror of the
  # snapshot, and the action in action.yml installs and starts it, on Linux,
  # macOS and Windows: the paths a published release takes, proven first.
  install:
    name: Install (${{ matrix.os }})
    needs: snapshot
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: snapshot
          path: dist

      - name: Install from a local mirror of the archives
        run: sh scripts/test-install.sh dist

      - name: Serve the archives as release downloads
        id: mirror
        run: |
          version="$(sed -n 's/.*"version": *"\([^"]*\)".*/\1/p' dist/metadata.json | head -n 1)"
          mirror="$RUNNER_TEMP/mirror"
          mkdir -p "$mirror/v$version"
          cp dist/tgfake_*.tar.gz dist/tgfake_*.zip dist/checksums.txt "$mirror/v$version/"
          py="$(command -v python3 || command -v python)"
          if command -v cygpath > /dev/null 2>&1; then mirror="$(cygpath -w "$mirror")"; fi
          nohup "$py" -m http.server 18799 --bind 127.0.0.1 --directory "$mirror" > "$RUNNER_TEMP/mirror.log" 2>&1 &
          for _ in $(seq 1 50); do curl -sf -o /dev/null "http://127.0.0.1:18799/v$version/checksums.txt" && break; sleep 0.2; done
          curl -sf -o /dev/null "http://127.0.0.1:18799/v$version/checksums.txt" || { cat "$RUNNER_TEMP/mirror.log" >&2; exit 1; }
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Set up tgfake with the action
        id: tgfake
        uses: ./
        with:
          version: ${{ steps.mirror.outputs.tag }}
          download-base: http://127.0.0.1:18799
          start: "true"
          args: --llm --llm-delay 0s

      - name: A bot talks to the started stand
        env:
          URL: ${{ steps.tgfake.outputs.url }}
          WANT: ${{ steps.mirror.outputs.tag }}
          GOT: ${{ steps.tgfake.outputs.version }}
        run: |
          set -euo pipefail
          [ "$GOT" = "$WANT" ] || { echo "the action installed $GOT, want $WANT" >&2; exit 1; }
          tgfake --version
          curl -sf "$URL/bot123:TOKEN/getMe" | grep -q '"username":"tgfake_bot"'
          curl -sf -X POST "$URL/sim/message" -H 'Content-Type: application/json' -d '{"text":"hello"}' > /dev/null
          curl -sf "$URL/bot123:TOKEN/getUpdates?timeout=0" | grep -q '"text":"hello"'
          curl -sf "$URL/v1/models" | grep -q 'tgfake-demo'

      - name: A second stand on a free port
        id: free
        uses: ./
        with:
          version: ${{ steps.mirror.outputs.tag }}
          download-base: http://127.0.0.1:18799
          start: "true"
          addr: 127.0.0.1:0

      - name: The free port is the one the action reports
        env:
          URL: ${{ steps.free.outputs.url }}
        run: |
          set -euo pipefail
          case "$URL" in http://127.0.0.1:18790) echo "the second stand reports the first one's port" >&2; exit 1 ;; esac
          curl -sf "$URL/bot123:TOKEN/getMe" | grep -q '"is_bot":true'

      - uses: actions/setup-go@v5
        if: runner.os == 'Linux'
        with:
          go-version: stable
          cache: true

      # The any-language integration test of examples/shell, against the
      # installed binary and the example bot.
      - name: The example bot passes bot-e2e.sh
        if: runner.os == 'Linux'
        env:
          TGFAKE_BIN: ${{ steps.tgfake.outputs.path }}
        run: sh examples/shell/bot-e2e.sh

  ci:
    name: CI
    if: always()
    needs: [test, lint, snapshot, install]
    runs-on: ubuntu-latest
    steps:
      - name: Every job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for r in $RESULTS; do
            [ "$r" = success ] || { echo "a job ended with $r" >&2; exit 1; }
          done
