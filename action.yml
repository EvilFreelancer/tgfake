name: Set up tgfake
description: Install the tgfake server, a fake Telegram Bot API for testing bots offline, and optionally start it in the background.
author: Pavel Rykov
branding:
  icon: send
  color: blue

inputs:
  version:
    description: Release to install, a tag such as v1.0.0, or latest. Empty means the tag the action itself was used at (uses EvilFreelancer/tgfake@v1.0.0 installs v1.0.0), else latest.
    required: false
    default: ""
  install-dir:
    description: Where the binary goes; empty means $RUNNER_TEMP/tgfake. The directory is added to PATH.
    required: false
    default: ""
  start:
    description: Start the server in the background and wait until it answers.
    required: false
    default: "false"
  addr:
    description: Address the started server listens on; port 0 picks a free one, and the url output names it.
    required: false
    default: 127.0.0.1:18790
  args:
    description: Extra arguments for the started server, split on whitespace, for example "--llm --llm-script rules.json".
    required: false
    default: ""
  download-base:
    description: Fetch <tag>/<asset> from here instead of the GitHub release downloads (a mirror, or a snapshot build under test).
    required: false
    default: ""

outputs:
  path:
    description: Path of the installed binary.
    value: ${{ steps.install.outputs.path }}
  version:
    description: Version the installed binary reports.
    value: ${{ steps.install.outputs.version }}
  url:
    description: Origin of the started server, for example http://127.0.0.1:18790; empty unless start is true.
    value: ${{ steps.start.outputs.url }}
  log:
    description: File the started server writes its output to; empty unless start is true.
    value: ${{ steps.start.outputs.log }}
  pid:
    description: Process id of the started server, to stop it with kill; empty unless start is true.
    value: ${{ steps.start.outputs.pid }}

runs:
  using: composite
  steps:
    - id: install
      shell: bash
      env:
        INPUT_VERSION: ${{ inputs.version }}
        ACTION_REF: ${{ github.action_ref }}
        INPUT_DIR: ${{ inputs.install-dir }}
        TGFAKE_DOWNLOAD_BASE: ${{ inputs.download-base }}
      run: |
        set -euo pipefail
        dir="${INPUT_DIR:-$RUNNER_TEMP/tgfake}"
        version="$INPUT_VERSION"
        if [ -z "$version" ]; then
          # The ref the action was used at: github.action_ref, which some
          # runners leave empty in a composite action, else the last element
          # of its checkout path (.../_actions/EvilFreelancer/tgfake/v1.0.0).
          ref="${ACTION_REF:-$(basename "$GITHUB_ACTION_PATH")}"
          case "$ref" in
            v[0-9]*.*) version="$ref" ;;
            *) version=latest ;;
          esac
        fi
        path="$(sh "$GITHUB_ACTION_PATH/scripts/install.sh" -b "$dir" "$version" | tail -n 1)"
        version="$("$path" --version | awk '{ print $2 }')"
        echo "$dir" >> "$GITHUB_PATH"
        echo "path=$path" >> "$GITHUB_OUTPUT"
        echo "version=$version" >> "$GITHUB_OUTPUT"
        echo "tgfake $version installed at $path"

    - id: start
      if: inputs.start == 'true'
      shell: bash
      env:
        TGFAKE_BIN: ${{ steps.install.outputs.path }}
        INPUT_ADDR: ${{ inputs.addr }}
        INPUT_ARGS: ${{ inputs.args }}
      run: |
        set -euo pipefail
        log="$RUNNER_TEMP/tgfake.log"
        # Word splitting of INPUT_ARGS is the point: it carries several flags.
        # shellcheck disable=SC2086
        nohup "$TGFAKE_BIN" --addr "$INPUT_ADDR" $INPUT_ARGS > "$log" 2>&1 &
        pid=$!
        # The origin is the one the banner names, so port 0 and a wildcard
        # address work too; a wildcard is reached through the loopback.
        for _ in $(seq 1 100); do
          if ! kill -0 "$pid" 2>/dev/null; then
            echo "tgfake exited before it served:" >&2
            cat "$log" >&2
            exit 1
          fi
          url="$(sed -n 's/^tgfake .* at \(http:[^ ]*\)$/\1/p' "$log" | head -n 1 | tr -d '\r')"
          url="$(printf '%s' "$url" | sed 's#//0\.0\.0\.0:#//127.0.0.1:#; s#//\[::\]:#//127.0.0.1:#')"
          if [ -n "$url" ] && curl -sf -o /dev/null "$url/sim/state"; then
            echo "url=$url" >> "$GITHUB_OUTPUT"
            echo "log=$log" >> "$GITHUB_OUTPUT"
            echo "pid=$pid" >> "$GITHUB_OUTPUT"
            echo "tgfake is serving at $url (pid $pid, log: $log)"
            exit 0
          fi
          sleep 0.2
        done
        echo "tgfake did not answer within 20 s:" >&2
        cat "$log" >&2
        exit 1
