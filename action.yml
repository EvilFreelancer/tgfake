name: Set up tgfake
description: Install the tgfake server, a fake Telegram Bot API for testing bots offline, and optionally start it in the background.
author: Pavel Rykov
branding:
  icon: send
  color: blue

inputs:
  version:
    description: Release to install, a tag such as v1.0.0, or latest. Empty means the tag the action itself was used at (uses EvilFreelancer/tgfake@v1.0.0 installs v1.0.0), else latest.
    required: false
    default: ""
  install-dir:
    description: Where the binary goes; empty means $RUNNER_TEMP/tgfake. The directory is added to PATH.
    required: false
    default: ""
  start:
    description: Start the server in the background and wait until it answers.
    required: false
    default: "false"
  addr:
    description: Address the started server listens on; port 0 picks a free one, and the url output names it.
    required: false
    default: 127.0.0.1:18790
  args:
    description: Extra arguments for the started server, split on whitespace, for example "--llm --llm-script rules.json".
    required: false
    default: ""
  serverless-project:
    description: Local project containing tgcloud/ to run in Docker; empty disables serverless. Requires start and a Linux Docker engine.
    required: false
    default: ""
  serverless-image:
    description: Node.js Docker image for serverless; the action pulls it if missing.
    required: false
    default: node:24-bookworm-slim
  serverless-db:
    description: SQLite file for serverless; empty uses a temporary database.
    required: false
    default: ""
  serverless-migrate:
    description: Explicitly create the serverless schema tables and indexes at startup.
    required: false
    default: "false"
  serverless-token:
    description: Fake bot token used by serverless and to verify Mini App initData.
    required: false
    default: 123456:SERVERLESS
  serverless-timeout:
    description: Maximum serverless invocation duration, including container startup.
    required: false
    default: 10s
  download-base:
    description: Fetch <tag>/<asset> from here instead of the GitHub release downloads (a mirror, or a snapshot build under test).
    required: false
    default: ""

outputs:
  path:
    description: Path of the installed binary.
    value: ${{ steps.install.outputs.path }}
  version:
    description: Version the installed binary reports.
    value: ${{ steps.install.outputs.version }}
  url:
    description: Origin of the started server, for example http://127.0.0.1:18790; empty unless start is true.
    value: ${{ steps.start.outputs.url }}
  log:
    description: File the started server writes its output to; empty unless start is true.
    value: ${{ steps.start.outputs.log }}
  pid:
    description: Process id of the started server, to stop it with kill; empty unless start is true.
    value: ${{ steps.start.outputs.pid }}

runs:
  using: composite
  steps:
    - id: install
      shell: bash
      env:
        INPUT_VERSION: ${{ inputs.version }}
        ACTION_REF: ${{ github.action_ref }}
        INPUT_DIR: ${{ inputs.install-dir }}
        TGFAKE_DOWNLOAD_BASE: ${{ inputs.download-base }}
      run: |
        set -euo pipefail
        dir="${INPUT_DIR:-$RUNNER_TEMP/tgfake}"
        version="$INPUT_VERSION"
        if [ -z "$version" ]; then
          # The ref the action was used at: github.action_ref, which some
          # runners leave empty in a composite action, else the last element
          # of its checkout path (.../_actions/EvilFreelancer/tgfake/v1.0.0).
          ref="${ACTION_REF:-$(basename "$GITHUB_ACTION_PATH")}"
          case "$ref" in
            v[0-9]*.*) version="$ref" ;;
            *) version=latest ;;
          esac
        fi
        path="$(sh "$GITHUB_ACTION_PATH/scripts/install.sh" -b "$dir" "$version" | tail -n 1)"
        version="$("$path" --version | awk '{ print $2 }')"
        echo "$dir" >> "$GITHUB_PATH"
        echo "path=$path" >> "$GITHUB_OUTPUT"
        echo "version=$version" >> "$GITHUB_OUTPUT"
        echo "tgfake $version installed at $path"

    - name: Prepare serverless Docker runtime
      if: inputs.serverless-project != ''
      shell: bash
      env:
        INPUT_START: ${{ inputs.start }}
        INPUT_PROJECT: ${{ inputs.serverless-project }}
        INPUT_IMAGE: ${{ inputs.serverless-image }}
        INPUT_MIGRATE: ${{ inputs.serverless-migrate }}
      run: |
        set -euo pipefail
        if [ "$INPUT_START" != true ]; then
          echo "serverless-project requires start: true" >&2
          exit 1
        fi
        case "$INPUT_MIGRATE" in
          true|false) ;;
          *) echo "serverless-migrate must be true or false" >&2; exit 1 ;;
        esac
        if [ ! -d "$INPUT_PROJECT/tgcloud" ]; then
          echo "serverless-project must contain tgcloud/" >&2
          exit 1
        fi
        docker_bin=docker
        if command -v docker.exe > /dev/null 2>&1; then docker_bin=docker.exe; fi
        if [ "$("$docker_bin" info --format '{{.OSType}}' | tr -d '\r')" != linux ]; then
          echo "serverless requires a running Linux Docker engine" >&2
          exit 1
        fi
        "$docker_bin" image inspect "$INPUT_IMAGE" > /dev/null 2>&1 || "$docker_bin" pull "$INPUT_IMAGE"

    - id: start
      if: inputs.start == 'true'
      shell: bash
      env:
        TGFAKE_BIN: ${{ steps.install.outputs.path }}
        INPUT_ADDR: ${{ inputs.addr }}
        INPUT_ARGS: ${{ inputs.args }}
        INPUT_PROJECT: ${{ inputs.serverless-project }}
        INPUT_IMAGE: ${{ inputs.serverless-image }}
        INPUT_DB: ${{ inputs.serverless-db }}
        INPUT_MIGRATE: ${{ inputs.serverless-migrate }}
        INPUT_TOKEN: ${{ inputs.serverless-token }}
        INPUT_TIMEOUT: ${{ inputs.serverless-timeout }}
      run: |
        set -euo pipefail
        log="$RUNNER_TEMP/tgfake.log"
        serverless_args=()
        if [ -n "$INPUT_PROJECT" ]; then
          serverless_args=(--serverless "$INPUT_PROJECT" --serverless-image "$INPUT_IMAGE" --token "$INPUT_TOKEN" --serverless-timeout "$INPUT_TIMEOUT")
          if [ -n "$INPUT_DB" ]; then serverless_args+=(--serverless-db "$INPUT_DB"); fi
          if [ "$INPUT_MIGRATE" = true ]; then serverless_args+=(--serverless-migrate); fi
        fi
        launcher=(nohup)
        # MSYS nohup can discard the environment of native Windows programs.
        # Non-interactive Bash does not send SIGHUP when its script exits.
        if command -v cygpath > /dev/null 2>&1; then launcher=(); fi
        # Word splitting of INPUT_ARGS is the point: it carries several flags.
        # shellcheck disable=SC2086
        TMPDIR="$RUNNER_TEMP" TMP="$RUNNER_TEMP" TEMP="$RUNNER_TEMP" "${launcher[@]}" "$TGFAKE_BIN" --addr "$INPUT_ADDR" "${serverless_args[@]}" $INPUT_ARGS > "$log" 2>&1 &
        pid=$!
        # The origin is the one the banner names, so port 0 and a wildcard
        # address work too; a wildcard is reached through the loopback.
        for _ in $(seq 1 100); do
          if ! kill -0 "$pid" 2>/dev/null; then
            echo "tgfake exited before it served:" >&2
            cat "$log" >&2
            exit 1
          fi
          url="$(sed -n 's/^tgfake .* at \(http:[^ ]*\)$/\1/p' "$log" | head -n 1 | tr -d '\r')"
          url="$(printf '%s' "$url" | sed 's#//0\.0\.0\.0:#//127.0.0.1:#; s#//\[::\]:#//127.0.0.1:#')"
          if [ -n "$url" ] && curl -sf -o /dev/null "$url/sim/state"; then
            echo "url=$url" >> "$GITHUB_OUTPUT"
            echo "log=$log" >> "$GITHUB_OUTPUT"
            echo "pid=$pid" >> "$GITHUB_OUTPUT"
            echo "tgfake is serving at $url (pid $pid, log: $log)"
            exit 0
          fi
          sleep 0.2
        done
        echo "tgfake did not answer within 20 s:" >&2
        cat "$log" >&2
        kill "$pid" 2>/dev/null || true
        exit 1
